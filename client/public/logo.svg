<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <defs>
    <linearGradient id="qcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9bff"/>
      <stop offset="1" stop-color="#0d47c4"/>
    </linearGradient>
    <linearGradient id="qcg" x1="0" y1="0" x2="0" y2="1">
