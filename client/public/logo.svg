  <rect x="98"  y="96"  width="14" height="50" rx="4" fill="url(#qcb)"/>
  <rect x="120" y="80"  width="14" height="66" rx="4" fill="url(#qcb)"/>
  <rect x="142" y="64"  width="14" height="70" rx="4" fill="url(#qcb)"/>
