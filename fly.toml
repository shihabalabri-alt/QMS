app = "qualicore-qms"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "qms_data"
  destination = "/app/server/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
